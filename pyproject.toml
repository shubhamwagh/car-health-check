[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "car-health-check"
version = "1.4.0"
description = "Free UK vehicle health check — tax, MOT and buying-signal report using DVSA MOT History API and Zyfy Vehicle Intelligence API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.30,<0.31",
    "httpx>=0.27,<0.28",
    "jinja2>=3.1,<3.2",
    "pydantic-settings>=2.4,<3.0",
    "click>=8.1,<9",
]

[project.scripts]
car-health-check = "carhealth.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "commitizen>=3.29",
    "pre-commit>=3.8",
    "ruff>=0.6",
    "ty>=0.0.1a1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/carhealth"]

[tool.hatch.build.targets.wheel.force-include]
"src/carhealth/templates" = "carhealth/templates"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=carhealth --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/carhealth"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.4.0"
version_files = ["pyproject.toml:^version"]
tag_format = "v$version"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
